# Keeps the free Supabase project awake and this workflow enabled. Optional, but recommended.
#
#  - Supabase pauses free projects after about a week without database activity.
#    One tiny request every 3 days prevents that.
#  - GitHub switches off scheduled workflows in repositories with no activity for 60 days.
#    Each run commits a one-line timestamp file, which counts as activity.
#
# Needs no secrets or variables: it reads the project URL and public key from config.js.
# If a run fails, GitHub emails you. The usual cause is a paused project: see README, "If Supabase pauses".
name: Keep alive

on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: write   # only to commit the timestamp file

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ping the database
        run: |
          node -e '
            const window = {};
            eval(require("fs").readFileSync("config.js", "utf8"));
            const c = window.TACMAP_CONFIG || {};
            if (!c.supabaseUrl || /YOUR-/.test(c.supabaseUrl + c.supabaseAnonKey)) { console.error("config.js is not filled in yet"); process.exit(1); }
            console.log("URL=" + c.supabaseUrl.replace(/\/+$/, ""));
            console.log("KEY=" + c.supabaseAnonKey);
          ' >> "$GITHUB_ENV"

      - name: Call keepalive()
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          echo

      - name: Record the run (keeps this workflow from being disabled)
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "keepalive $(cat .github/keepalive.txt)" || exit 0
          git push
